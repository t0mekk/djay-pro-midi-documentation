<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>djay MIDI Mapper</title>
<style>
:root {
  --bg: #14161a; --panel: #1c1f25; --panel2: #23272f; --line: #343a45;
  --text: #e6e8ec; --dim: #8b93a1; --accent: #ffb000; --bad: #ff6b5e; --ok: #5fd08a;
  --d1: #4aa8ff; --d2: #ff8a3d; --d3: #5fd08a; --d4: #c58bff; --dg: #c9ced8;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
input[type=text], input[type=number], input[type=search], select {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; min-width: 0;
}
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1300; font-weight: 600; }
.btn.on { border-color: var(--accent); color: var(--accent); }
label.f { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); white-space: nowrap; }
label.f > input[type=text] { width: 130px; color: var(--text); }

header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 14px; margin: 0 6px 0 0; letter-spacing: .04em; }
header .sp { flex: 1; }
#midiStatus { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); }
#midiStatus i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
#midiStatus.ok i { background: var(--ok); }
#deckOrder input { width: 30px; text-align: center; padding: 3px 2px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(400px, auto) minmax(340px, 1fr) 280px; }
main > section { min-height: 0; overflow: auto; padding: 12px; }
#mid { border-left: 1px solid var(--line); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }

/* --- surface --- */
.layerbar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
.k2 { width: 392px; background: #0d0e11; border: 1px solid #000; border-radius: 10px; padding: 12px 10px; box-shadow: inset 0 0 0 1px #2a2d34; }
.k2 .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
.k2 .gap { height: 8px; }
.ctl { position: relative; background: #1b1e24; border: 1px solid #30353f; border-radius: 6px; color: var(--text); cursor: pointer; padding: 3px 4px; min-height: 30px; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 1.15; text-align: center; overflow: hidden; }
.ctl .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl .id { color: var(--dim); font: 9px var(--mono); }
.ctl.empty .lbl { color: #555c69; }
.ctl.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ctl.hit { background: #3a3116; }
.ctl.other::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.ctl.d1 { border-left: 3px solid var(--d1); } .ctl.d2 { border-left: 3px solid var(--d2); }
.ctl.d3 { border-left: 3px solid var(--d3); } .ctl.d4 { border-left: 3px solid var(--d4); }
.ctl.dg { border-left: 3px solid var(--dg); }
.ctl.pot, .ctl.enc { min-height: 54px; }
.ctl.fader { min-height: 92px; }
.glyph { flex: none; }
.pot .glyph, .enc .glyph { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #5a6170; position: relative; }
.pot .glyph::after { content: ""; position: absolute; left: 50%; top: 1px; width: 2px; height: 9px; margin-left: -1px; background: var(--text); transform-origin: 50% 10px; transform: rotate(calc(-135deg + var(--v, .5) * 270deg)); }
.enc .glyph { border-style: dashed; }
.fader .glyph { width: 6px; height: 56px; border-radius: 3px; background: #30353f; position: relative; }
.fader .glyph::after { content: ""; position: absolute; left: -7px; width: 20px; height: 8px; border-radius: 2px; background: var(--text); bottom: calc(var(--v, .5) * 48px); }
.generic { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; width: 392px; }
.hint { color: var(--dim); font-size: 12px; max-width: 392px; }

/* --- inspector --- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.ctlhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.ctlhead b { font-size: 14px; }
.ctlhead code, .entry code { font: 11px var(--mono); color: var(--dim); }
.entry { border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; margin-top: 6px; background: var(--panel2); }
.entry .top { display: flex; gap: 8px; align-items: baseline; }
.entry .top b { flex: 1; }
.entry .x { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 15px; padding: 0 4px; }
.entry .x:hover { color: var(--bad); }
.opts { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; }
.opts select, .opts input[type=number] { padding: 2px 5px; }
.opts input[type=number] { width: 64px; }
.chip { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--dim); }
.chip.warn { color: var(--accent); border-color: var(--accent); }
.badge { font: 600 10px var(--mono); padding: 0 5px; border-radius: 3px; color: #111; }
.badge.d1 { background: var(--d1); } .badge.d2 { background: var(--d2); } .badge.d3 { background: var(--d3); } .badge.d4 { background: var(--d4); } .badge.dg { background: var(--dg); }
.none { color: var(--dim); padding: 6px 0 0; }

#picker { flex: 1; min-height: 220px; display: flex; flex-direction: column; }
.pickbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.pickbar input[type=search] { flex: 1; min-width: 120px; }
#actions { flex: 1; overflow: auto; min-height: 0; margin: 0 -4px; }
#actions h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 10px 4px 3px; font-weight: 600; }
.act { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 3px 4px; cursor: pointer; }
.act:hover, .act.first { background: var(--panel2); }
.act .n { flex: none; }
.act .d { flex: 1; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act .t { color: var(--dim); font: 10px var(--mono); }

/* --- side --- */
#checks div { padding: 3px 0 3px 16px; position: relative; }
#checks div::before { content: "●"; position: absolute; left: 0; font-size: 9px; top: 6px; color: var(--ok); }
#checks div.w::before { color: var(--accent); }
#monitor { font: 11px/1.5 var(--mono); color: var(--dim); white-space: pre; }
#monitor b { color: var(--text); font-weight: 400; }
#drop { position: fixed; inset: 0; background: rgba(20,22,26,.85); display: none; align-items: center; justify-content: center; font-size: 20px; border: 3px dashed var(--accent); z-index: 9; }
body.drag #drop { display: flex; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } main > section { overflow: visible; } body { height: auto; } #mid { border: 0; } }
</style>
</head>
<body>
<header>
  <h1>djay MIDI Mapper</h1>
  <label class="f">Name <input type="text" id="name" spellcheck="false"></label>
  <label class="f" title="Must match the device name djay sees (the CoreMIDI port name)">Device <input type="text" id="endpoint" spellcheck="false"></label>
  <label class="f">Surface
    <select id="profile"><option value="k2">Xone:K2</option><option value="generic">Learn (Xone:4D / any)</option></select>
  </label>
  <label class="f" id="chWrap" title="K2 MIDI channel as shown on the hardware (1-16). The file stores channel - 1.">K2 ch <select id="channel"></select></label>
  <span class="f" id="deckOrder" title="Which deck each K2 column controls, left to right">Columns → decks
    <input type="text" maxlength="1"><input type="text" maxlength="1"><input type="text" maxlength="1"><input type="text" maxlength="1">
  </span>
  <span class="sp"></span>
  <span id="midiStatus"><i></i><span>MIDI off</span></span>
  <button class="btn on" id="follow" title="Touch a control on the hardware to select it here">Follow hardware</button>
  <button class="btn" id="new">New</button>
  <button class="btn" id="import">Import…</button>
  <button class="btn primary" id="export">Export .djayMidiMapping</button>
  <input type="file" id="file" accept=".djayMidiMapping,.plist,.xml" hidden>
</header>

<main>
  <section id="left">
    <div class="layerbar">
      <h2 style="margin:0 6px 0 0">Layer</h2>
      <button class="btn" data-slot="0">Normal</button>
      <button class="btn" data-slot="1">Shift</button>
      <span class="chip" id="count"></span>
    </div>
    <div id="surface"></div>
  </section>

  <section id="mid">
    <div class="card" id="inspector"></div>
    <div class="card" id="picker">
      <div class="pickbar">
        <input type="search" id="q" placeholder="Search actions…  ( / )" spellcheck="false">
        <label class="f">Deck <select id="deck"><option value="0">Auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
        <label class="f" title="Only show actions that suit the selected control type"><input type="checkbox" id="fits" checked> fits control</label>
        <label class="f" id="rowWrap" title="Assign the same action to this row in all 4 columns, one deck per column"><input type="checkbox" id="rowApply"> all 4 columns</label>
      </div>
      <div id="actions"></div>
    </div>
  </section>

  <section id="right">
    <h2>Checks</h2>
    <div id="checks"></div>
    <h2 style="margin-top:16px">MIDI monitor</h2>
    <div id="monitor">Move a control…</div>
  </section>
</main>
<div id="drop">Drop a .djayMidiMapping file to import</div>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- plist ----------
const REAL_KEYS = new Set(['rotarySensitivity', 'midiMinValue', 'midiMaxValue']);

function parsePlist(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror') || doc.documentElement.tagName !== 'plist') throw new Error('Not a property list file');
  const read = (el, key) => {
    switch (el.tagName) {
      case 'dict': {
        const o = {}, ch = [...el.children];
        for (let i = 0; i + 1 < ch.length; i += 2) o[ch[i].textContent] = read(ch[i + 1], ch[i].textContent);
        return o;
      }
      case 'array': return [...el.children].map((c) => read(c, key));
      case 'string': return el.textContent;
      case 'integer': return parseInt(el.textContent, 10);
      case 'real': if (key) REAL_KEYS.add(key); return parseFloat(el.textContent);
      case 'true': return true;
      case 'false': return false;
      default: return { __xml: new XMLSerializer().serializeToString(el) }; // data/date: pass through untouched
    }
  };
  return read(doc.documentElement.firstElementChild, null);
}

function toPlist(root) {
  const x = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const ser = (v, key, ind) => {
    const t = '\t'.repeat(ind);
    if (v === true) return t + '<true/>';
    if (v === false) return t + '<false/>';
    if (typeof v === 'string') return `${t}<string>${x(v)}</string>`;
    if (typeof v === 'number') return REAL_KEYS.has(key) || !Number.isInteger(v) ? `${t}<real>${v}</real>` : `${t}<integer>${v}</integer>`;
    if (Array.isArray(v)) return v.length ? `${t}<array>\n${v.map((i) => ser(i, key, ind + 1)).join('\n')}\n${t}</array>` : `${t}<array/>`;
    if (v.__xml) return t + v.__xml;
    const keys = Object.keys(v).sort();
    if (!keys.length) return `${t}<dict/>`;
    return `${t}<dict>\n${keys.map((k) => `${t}\t<key>${x(k)}</key>\n${ser(v[k], k, ind + 1)}`).join('\n')}\n${t}</dict>`;
  };
  return '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n' +
    ser(root, null, 0) + '\n</plist>\n';
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ S, reals: [...REAL_KEYS] })); } catch (e) { /* private mode */ }

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE));
    if (d && d.S && Array.isArray(d.S.entries)) { S = Object.assign(fresh(), d.S); d.reals.forEach((k) => REAL_KEYS.add(k)); }
  } catch (e) { /* start fresh */ }
}

// ---------- controls ----------
const cid = (msg, ch, data) => `${msg}:${ch}:${data}`;

function k2Controls(ch) {
  const out = [];
  const add = (kind, msg, data, name, extra) => out.push(Object.assign({ id: cid(msg, ch, data), kind, msg, ch, data, name, led: msg === 1 ? 36 : 0 }, extra));
  for (let c = 0; c < 4; c++) {
    add('enc', 3, c, `Encoder ${c + 1}`, { col: c, row: 'enc' });
    add('btn', 1, 52 + c, `Encoder ${c + 1} push`, { col: c, row: 'encp' });
    for (let p = 0; p < 3; p++) {
      add('pot', 3, 4 + p * 4 + c, `Pot ${p + 1} · column ${c + 1}`, { col: c, row: 'pot' + p });
      add('btn', 1, 48 - p * 4 + c, `Pot ${p + 1} button · column ${c + 1}`, { col: c, row: 'pb' + p });
    }
    add('fader', 3, 16 + c, `Fader ${c + 1}`, { col: c, row: 'fader' });
    for (let r = 0; r < 4; r++) add('btn', 1, 36 - r * 4 + c, `Button ${String.fromCharCode(65 + r * 4 + c)}`, { col: c, row: 'grid' + r });
  }
  add('btn', 1, 12, 'Layer', { row: 'bottom', led: 4 });
  add('enc', 3, 20, 'Bottom encoder L', { row: 'bottom' });
  add('btn', 1, 13, 'Bottom encoder L push', { row: 'bottom', led: 0 });
  add('enc', 3, 21, 'Bottom encoder R', { row: 'bottom' });
  add('btn', 1, 14, 'Bottom encoder R push', { row: 'bottom', led: 0 });
  add('btn', 1, 15, 'Exit setup', { row: 'bottom', led: 4 });
  return out;
}

// Template controls (if any) + everything else that appears in the mapping or was seen on the wire.
function allControls() {
  const list = S.profile === 'k2' ? k2Controls(S.channel) : [];
  const have = new Set(list.map((c) => c.id));
  const extra = (msg, ch, data, kind) => {
    const id = cid(msg, ch, data);
    if (have.has(id)) return;
    have.add(id);
    list.push({ id, kind, msg, ch, data, name: `${msg === 1 ? 'Note' : 'CC'} ${data}`, led: 0, extra: true });
  };
  for (const l of S.learned) extra(l.msg, l.ch, l.data, l.kind);
  for (const e of S.entries) if (isMapping(e)) extra(e.midiMessageType, e.midiChannel, e.midiData, e.midiMessageType === 1 ? 'btn' : /^rotary/.test(e.controlType || '') ? 'enc' : 'pot');
  return list;
}
const isMapping = (e) => e && typeof e.keyPath === 'string' && Number.isInteger(e.midiData);
const entriesOf = (c, mod) => S.entries.filter((e) => e.midiMessageType === c.msg && e.midiChannel === c.ch && e.midiData === c.data && !!e.modifier === !!mod);

// ---------- actions ----------
const BY_KEY = new Map(ACTIONS.map((a) => [a.k, a]));
function describe(keyPath) {
  let a = BY_KEY.get(keyPath), deck = 0;
  if (!a) {
    const m = keyPath.match(/turntable([1-4])/);
    if (m) { a = BY_KEY.get(keyPath.replace(m[0], 'turntable{N}')); deck = +m[1]; }
  }
  if (!a && !keyPath.includes('.')) return { name: 'No-op', deck: 0, action: BY_KEY.get('application') };
  if (!deck) { const m = keyPath.match(/^(?:mixer\.(?:lineVolume|monitorActive)|musicLibrary\.load)([1-4])$/); if (m) deck = +m[1]; }
  return { name: a ? a.n : keyPath.split('.').pop(), deck, action: a };
}
const fits = (action, kind) => !action || action.t === 'any' ||
  (kind === 'btn' ? action.t === 'button' : kind === 'enc' ? action.t !== 'button' : action.t === 'knob');

function makeEntry(c, mod, action, keyPath) {
  const e = { keyPath, midiChannel: c.ch, midiData: c.data, midiMessageType: c.msg };
  if (mod) e.modifier = true;
  if (c.msg === 3 && c.kind === 'enc') e.controlType = 'rotary';
  if (c.msg === 1 && action.led) e.output = {};
  if (keyPath === 'application.modifier') e.buttonMode = 'hold';
  return e;
}

// Replace the slot's unconditional entry (entries carrying a `condition` are left alone).
function assign(c, mod, action, keyPath) {
  const e = makeEntry(c, mod, action, keyPath);
  const i = S.entries.findIndex((x) => x.midiMessageType === c.msg && x.midiChannel === c.ch && x.midiData === c.data && !!x.modifier === !!mod && !x.condition);
  if (i >= 0) S.entries[i] = e; else S.entries.push(e);
}

function pick(action) {
  const all = allControls();
  const c = all.find((x) => x.id === sel);
  if (!c) return;
  const deckSel = +$('#deck').value;
  const deckFor = (ctl) => deckSel || (ctl.col != null ? S.deckOrder[ctl.col] : 1);
  // per-deck variants: turntable{N}.x, or numbered globals such as mixer.lineVolume1..4
  const numbered = !action.k.includes('{N}') && /[1-4]$/.test(action.k) && [1, 2, 3, 4].every((n) => BY_KEY.has(action.k.replace(/[1-4]$/, n)));
  const pathFor = (deck) => action.k.includes('{N}') ? action.k.replace('{N}', deck) : numbered ? action.k.replace(/[1-4]$/, deck) : action.k;

  if ($('#rowApply').checked && c.col != null && (action.k.includes('{N}') || numbered)) {
    for (const sib of all.filter((x) => x.row === c.row && x.col != null)) assign(sib, slot, action, pathFor(S.deckOrder[sib.col]));
  } else {
    assign(c, slot, action, action.k.includes('{N}') ? pathFor(deckFor(c)) : action.k);
  }
  render();
}

// ---------- rendering ----------
function tile(c) {
  const mine = entriesOf(c, slot), other = entriesOf(c, !slot);
  const d = mine.length ? describe(mine[0].keyPath) : null;
  const cls = ['ctl', c.kind, c.id === sel ? 'sel' : '', mine.length ? (d.deck ? 'd' + d.deck : 'dg') : 'empty', other.length ? 'other' : ''].join(' ');
  const text = d ? (d.deck ? `D${d.deck} ` : '') + d.name + (mine.length > 1 ? ` +${mine.length - 1}` : '') : (S.labels[c.id] || (c.extra ? '—' : shortName(c)));
  const idline = c.extra ? `<span class="id">${esc(S.labels[c.id] || `${c.msg === 1 ? 'N' : 'CC'}${c.data} ch${c.ch + 1}`)}</span>` : '';
  const glyph = c.kind === 'btn' ? '' : '<span class="glyph"></span>';
  return `<button class="${cls}" data-id="${c.id}" title="${esc(c.name)} — ${c.msg === 1 ? 'Note' : 'CC'} ${c.data}, ch ${c.ch + 1}">${glyph}<span class="lbl">${esc(text)}</span>${idline}</button>`;
}
const shortName = (c) => c.name.replace(/ · column \d/, '').replace(/^Pot \d button$/, 'btn').replace(/^Encoder \d push$/, 'push').replace('Bottom encoder ', 'Enc ').replace(/^Button /, '');

function renderSurface() {
  const all = allControls();
  let h = '';
  if (S.profile === 'k2') {
    const rows = ['enc', 'encp', 'pot0', 'pb0', 'pot1', 'pb1', 'pot2', 'pb2', 'fader', 'grid0', 'grid1', 'grid2', 'grid3'];
    h += '<div class="k2">';
    for (const r of rows) {
      if (r === 'fader' || r === 'grid0') h += '<div class="gap"></div>';
      h += `<div class="row">${all.filter((c) => c.row === r).map(tile).join('')}</div>`;
    }
    const b = Object.fromEntries(all.filter((c) => c.row === 'bottom').map((c) => [c.data + ':' + c.msg, c]));
    h += `<div class="gap"></div><div class="row">${tile(b['12:1'])}${tile(b['20:3'])}${tile(b['21:3'])}${tile(b['15:1'])}</div>`;
    h += `<div class="row"><span></span>${tile(b['13:1'])}${tile(b['14:1'])}<span></span></div></div>`;
  }
  const extra = all.filter((c) => c.extra).sort((a, b) => b.msg - a.msg || a.ch - b.ch || a.data - b.data);
  if (extra.length) h += `<h2 style="margin-top:14px">${S.profile === 'k2' ? 'Other controls' : 'Controls'}</h2><div class="generic">${extra.map(tile).join('')}</div>`;
  else if (S.profile !== 'k2') h += '<p class="hint">No controls yet. Move every knob, fader and button on the hardware once — each one appears here as it is touched. Or import an existing mapping.</p>';
  $('#surface').innerHTML = h;
  document.querySelectorAll('.layerbar [data-slot]').forEach((b) => b.classList.toggle('on', +b.dataset.slot === slot));
  const n = S.entries.filter(isMapping).length;
  $('#count').textContent = `${n} mapping${n === 1 ? '' : 's'}`;
}

function ledState(e, c) {
  if (!e.output) return 'none';
  const k = Object.keys(e.output);
  if (!k.length) return 'default';
  if (e.output.midiData === c.data + c.led) return 'amber';
  if (e.output.midiData === c.data + 2 * c.led) return 'green';
  return 'custom';
}

function renderInspector() {
  const c = allControls().find((x) => x.id === sel);
  const box = $('#inspector');
  $('#rowWrap').style.display = c && c.col != null ? '' : 'none';
  if (!c) { box.innerHTML = '<div class="none">Select a control — click it, or touch it on the hardware.</div>'; return; }
  const list = entriesOf(c, slot);
  let h = `<div class="ctlhead"><b>${esc(S.labels[c.id] || c.name)}</b><code>${c.msg === 1 ? 'Note' : 'CC'} ${c.data} · ch ${c.ch + 1} (file: ${c.ch})</code>
    <span class="chip">${slot ? 'Shift' : 'Normal'} layer</span>
    ${c.extra ? `<label class="f">Label <input type="text" id="label" value="${esc(S.labels[c.id] || '')}" placeholder="e.g. Jog L"></label>` : ''}
    ${c.msg === 1 ? '<button class="btn" id="flash" title="Light this LED on the hardware">Flash LED</button>' : ''}</div>`;
  if (!list.length) h += `<div class="none">Nothing mapped on this layer. Pick an action below.</div>`;
  list.forEach((e) => {
    const i = S.entries.indexOf(e), d = describe(e.keyPath);
    const sel2 = (key, opts) => `<select data-i="${i}" data-k="${key}">${opts.map(([v, t]) => `<option value="${v}"${(e[key] || '') === v ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
    const chk = (key, t) => `<label class="f"><input type="checkbox" data-i="${i}" data-k="${key}"${e[key] ? ' checked' : ''}> ${t}</label>`;
    const known = ['keyPath', 'midiChannel', 'midiData', 'midiMessageType', 'modifier', 'controlType', 'buttonMode', 'output', 'flipped', 'pickupMode', 'rotarySensitivity'];
    const rest = Object.keys(e).filter((k) => !known.includes(k));
    let o = '';
    if (c.msg === 3) {
      o += `<label class="f">Type ${sel2('controlType', [['', 'absolute (pot/fader)'], ['rotary', 'rotary (relative)'], ['rotary-64', 'rotary-64'], ['rotary-absolute', 'rotary-absolute'], ['button', 'button']])}</label>`;
      if (/^rotary/.test(e.controlType || '')) o += `<label class="f">Sensitivity <input type="number" data-i="${i}" data-k="rotarySensitivity" value="${e.rotarySensitivity ?? ''}" placeholder="default" min="1" max="1000"></label>`;
      else o += chk('pickupMode', 'pickup');
      o += chk('flipped', 'flipped');
    } else {
      o += `<label class="f">Mode ${sel2('buttonMode', [['', 'default'], ['toggle', 'toggle'], ['hold', 'hold'], ['button-blinking', 'blinking']])}</label>`;
      const ls = ledState(e, c);
      const lo = [['none', 'off'], ['default', c.led ? 'red (default)' : 'default']];
      if (c.led) lo.push(['amber', 'amber'], ['green', 'green']);
      if (ls === 'custom') lo.push(['custom', 'custom (kept)']);
      o += `<label class="f">LED <select data-i="${i}" data-k="__led">${lo.map(([v, t]) => `<option value="${v}"${ls === v ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`;
    }
    h += `<div class="entry"><div class="top"><span class="badge ${d.deck ? 'd' + d.deck : 'dg'}">${d.deck ? 'D' + d.deck : 'ALL'}</span><b>${esc(d.name)}</b>
      <code>${esc(e.keyPath)}</code><button class="x" data-del="${i}" title="Remove">×</button></div>
      <div class="opts">${o}${!c.extra && !fits(d.action, c.kind) ? '<span class="chip warn">action expects a different control type</span>' : ''}
      ${rest.map((k) => `<span class="chip" title="${esc(JSON.stringify(e[k]))}">${esc(k)} kept</span>`).join('')}</div></div>`;
  });
  box.innerHTML = h;
}

function renderActions() {
  const c = allControls().find((x) => x.id === sel);
  const q = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const onlyFits = $('#fits').checked && c;
  let h = '', group = '', first = true;
  for (const a of ACTIONS) {
    if (onlyFits && !fits(a, c.kind)) continue;
    const hay = `${a.n} ${a.k} ${a.g} ${a.d}`.toLowerCase();
    if (!q.every((w) => hay.includes(w))) continue;
    if (a.g !== group) { group = a.g; h += `<h3>${esc(group)}</h3>`; }
    h += `<button class="act${first && q.length ? ' first' : ''}" data-k="${esc(a.k)}"><span class="n">${esc(a.n)}</span><span class="d">${esc(a.d)}</span><span class="t">${a.k.includes('{N}') ? 'deck' : ''}${a.led ? ' led' : ''}</span></button>`;
    first = false;
  }
  $('#actions').innerHTML = h || '<div class="none">No matching actions. Untick “fits control” to see everything.</div>';
}

function renderChecks() {
  const out = [], all = allControls(), byId = new Map(all.map((c) => [c.id, c]));
  const w = (t) => out.push(`<div class="w">${t}</div>`);
  if (!S.entries.length) out.push('<div>Empty mapping. Select a control and pick an action.</div>');
  if (S.entries.some((e) => e.modifier) && !S.entries.some((e) => e.keyPath === 'application.modifier')) w('Shift-layer mappings exist but no button is mapped to <b>Modifier</b> (search “shift”).');
  const seen = new Map(); let dup = 0, mis = 0;
  for (const e of S.entries) {
    if (!isMapping(e)) continue;
    if (!e.condition) { const k = cid(e.midiMessageType, e.midiChannel, e.midiData) + (e.modifier ? 's' : ''); if (seen.has(k)) dup++; seen.set(k, 1); }
    const c = byId.get(cid(e.midiMessageType, e.midiChannel, e.midiData));
    if (c && !c.extra && !fits(describe(e.keyPath).action, c.kind)) mis++;
  }
  if (dup) w(`${dup} control${dup > 1 ? 's have' : ' has'} more than one action on the same layer.`);
  if (mis) w(`${mis} mapping${mis > 1 ? 's put' : ' puts'} an action on an unsuitable control type (e.g. a knob action on a button).`);
  if (S.profile === 'k2' && foreignCh != null && foreignCh !== S.channel) w(`MIDI is arriving on ch ${foreignCh + 1} but the K2 surface is set to ch ${S.channel + 1}.`);
  if (!S.meta.endpointName) w('Device name is empty — djay matches mappings to hardware by this name.');
  if (!out.length) out.push('<div>No problems found.</div>');
  $('#checks').innerHTML = out.join('');
}

function renderHeader() {
  $('#name').value = S.name;
  $('#endpoint').value = S.meta.endpointName || '';
  $('#profile').value = S.profile;
  $('#channel').value = S.channel;
  const k2 = S.profile === 'k2';
  $('#chWrap').style.display = $('#deckOrder').style.display = k2 ? '' : 'none';
  document.querySelectorAll('#deckOrder input').forEach((el, i) => { el.value = S.deckOrder[i]; });
}

function render() { renderSurface(); renderInspector(); renderActions(); renderChecks(); save(); }
function select(id) { if (sel === id) return; sel = id; render(); }

// ---------- events ----------
$('#channel').innerHTML = Array.from({ length: 16 }, (_, i) => `<option value="${i}">${i + 1}</option>`).join('');

$('#surface').addEventListener('click', (ev) => { const b = ev.target.closest('.ctl'); if (b) select(b.dataset.id); });
document.querySelector('.layerbar').addEventListener('click', (ev) => { const b = ev.target.closest('[data-slot]'); if (b) { slot = +b.dataset.slot; render(); } });
$('#actions').addEventListener('click', (ev) => { const b = ev.target.closest('.act'); if (b) pick(BY_KEY.get(b.dataset.k)); });
$('#q').addEventListener('input', renderActions);
$('#q').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { const b = $('#actions .act'); if (b) pick(BY_KEY.get(b.dataset.k)); } });
$('#fits').addEventListener('change', renderActions);
document.addEventListener('keydown', (ev) => {
  if (/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) { if (ev.key === 'Escape') ev.target.blur(); return; }
  if (ev.key === '/') { ev.preventDefault(); $('#q').select(); }
  if (ev.key === 's' || ev.key === 'S') { slot = slot ? 0 : 1; render(); }
});

$('#inspector').addEventListener('click', (ev) => {
  const del = ev.target.closest('[data-del]');
  if (del) { S.entries.splice(+del.dataset.del, 1); render(); }
  if (ev.target.id === 'flash') flashLed();
});
$('#inspector').addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'label') { if (el.value.trim()) S.labels[sel] = el.value.trim(); else delete S.labels[sel]; render(); return; }
  const e = S.entries[+el.dataset.i], k = el.dataset.k;
  if (!e || !k) return;
  const c = allControls().find((x) => x.id === sel);
  if (k === '__led') {
    if (el.value === 'none') delete e.output;
    else if (el.value === 'default') e.output = {};
    else if (el.value !== 'custom') e.output = { midiChannel: c.ch, midiData: c.data + c.led * (el.value === 'amber' ? 1 : 2), midiMessageType: 1 };
  } else if (el.type === 'checkbox') { if (el.checked) e[k] = true; else delete e[k]; }
  else if (el.type === 'number') { if (el.value === '') delete e[k]; else e[k] = +el.value; }
  else { if (el.value) e[k] = el.value; else delete e[k]; if (k === 'controlType' && !/^rotary/.test(el.value)) delete e.rotarySensitivity; }
  render();
});

$('#name').addEventListener('change', (ev) => { S.name = ev.target.value.trim() || 'mapping'; save(); });
$('#endpoint').addEventListener('change', (ev) => { S.meta.endpointName = ev.target.value.trim(); render(); });
$('#profile').addEventListener('change', (ev) => { S.profile = ev.target.value; renderHeader(); render(); });
$('#channel').addEventListener('change', (ev) => { rechannel(+ev.target.value); render(); });
$('#deckOrder').addEventListener('change', (ev) => {
  const i = [...document.querySelectorAll('#deckOrder input')].indexOf(ev.target), v = +ev.target.value;
  if (v >= 1 && v <= 4) S.deckOrder[i] = v;
  renderHeader(); render();
});
$('#follow').addEventListener('click', (ev) => { follow = !follow; ev.target.classList.toggle('on', follow); });
$('#new').addEventListener('click', () => {
  if (S.entries.length && !confirm('Discard the current mapping and start a new one?')) return;
  const p = S.profile; S = fresh(); S.profile = p;
  if (p !== 'k2') { S.name = 'My mapping'; S.meta = { endpointName: lastPort || '', schemeVersion: 1, version: 0 }; }
  sel = null; renderHeader(); render();
});

// Moving the K2 to another channel carries its mappings along.
function rechannel(ch) {
  const old = S.channel;
  for (const e of S.entries) {
    if (e.midiChannel === old) e.midiChannel = ch;
    if (e.output && e.output.midiChannel === old) e.output.midiChannel = ch;
  }
  if (sel) { const p = sel.split(':'); if (+p[1] === old) sel = cid(p[0], ch, p[2]); }
  S.channel = ch;
}

// ---------- import / export ----------
function importText(text, filename) {
  let root;
  try { root = parsePlist(text); } catch (e) { alert('Could not read that file: ' + e.message); return; }
  if (!root || !Array.isArray(root.controls)) { alert('That file has no "controls" list — is it a djay MIDI mapping?'); return; }
  const { controls, ...meta } = root;
  S = fresh();
  S.meta = meta;
  S.entries = controls;
  S.name = (filename || 'mapping').replace(/\.[^.]+$/, '');
  S.profile = /xone:?\s?k2/i.test(meta.endpointName || '') ? 'k2' : 'generic';
  const tally = {};
  for (const e of S.entries.filter(isMapping)) tally[e.midiChannel] = (tally[e.midiChannel] || 0) + 1;
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
  if (top) S.channel = +top[0];
  if (S.profile === 'k2') { // recover the column → deck order from the faders / play row
    k2Controls(S.channel).filter((c) => c.row === 'fader').forEach((c) => {
      const e = entriesOf(c, 0)[0], d = e && describe(e.keyPath).deck;
      if (d) S.deckOrder[c.col] = d;
    });
  }
  sel = null; slot = 0; renderHeader(); render();
}
function exportFile() {
  const text = toPlist(Object.assign({}, S.meta, { controls: S.entries }));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/xml' }));
  a.download = (S.name || 'mapping').replace(/[\\/:]/g, '_') + '.djayMidiMapping';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#import').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (ev) => { const f = ev.target.files[0]; if (f) importText(await f.text(), f.name); ev.target.value = ''; });
$('#export').addEventListener('click', exportFile);
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('drag'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('drag'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', async (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('drag');
  const f = e.dataTransfer.files[0]; if (f) importText(await f.text(), f.name);
});

// ---------- MIDI ----------
let midi = null, lastPort = '';
const log = [];

function onMidi(ev) {
  const [st, data, val = 0] = ev.data;
  const type = st & 0xf0, ch = st & 0x0f;
  if (type !== 0x90 && type !== 0x80 && type !== 0xb0) return;
  const msg = type === 0xb0 ? 3 : 1, on = type === 0xb0 || (type === 0x90 && val > 0);
  lastPort = ev.target.name || lastPort;
  log.unshift(`<b>${msg === 1 ? (on ? 'Note on ' : 'Note off') : 'CC      '} ${String(data).padStart(3)}</b>  val ${String(val).padStart(3)}  ch ${ch + 1}`);
  log.length = Math.min(log.length, 14);
  $('#monitor').innerHTML = log.join('\n');

  const id = cid(msg, ch, data);
  let structural = false;
  if (S.profile === 'k2' && ch !== S.channel) {
    foreignCh = ch;
    if (!S.entries.some((e) => e.midiChannel === S.channel)) { rechannel(ch); renderHeader(); structural = true; }
  }
  if (msg === 3) (ccSeen[id] = ccSeen[id] || new Set()).add(val);
  if (!allControls().some((c) => c.id === id)) {
    S.learned.push({ msg, ch, data, kind: msg === 1 ? 'btn' : 'pot' });
    structural = true;
  }
  // endless encoders only ever send small +/- steps (1..3 / 125..127)
  const l = S.learned.find((x) => x.msg === 3 && cid(3, x.ch, x.data) === id);
  if (l && ccSeen[id].size >= 2) {
    const kind = [...ccSeen[id]].every((v) => v <= 3 || v >= 125) ? 'enc' : 'pot';
    if (kind !== l.kind) { l.kind = kind; structural = true; }
  }
  if (!S.meta.endpointName && lastPort) { S.meta.endpointName = lastPort; renderHeader(); structural = true; }

  if (on && follow && sel !== id) { sel = id; structural = true; }
  if (structural) render();
  const el = document.querySelector(`.ctl[data-id="${id}"]`);
  if (el) {
    if (msg === 3) el.style.setProperty('--v', val / 127);
    el.classList.toggle('hit', on);
    if (msg === 3) { clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('hit'), 150); }
  }
}

function flashLed() {
  const c = allControls().find((x) => x.id === sel);
  if (!midi || !c) return;
  const outs = [...midi.outputs.values()];
  const out = outs.find((o) => o.name === (S.meta.endpointName || lastPort)) || outs[0];
  if (!out) { alert('No MIDI output available.'); return; }
  const e = entriesOf(c, slot)[0];
  const note = e && e.output && Number.isInteger(e.output.midiData) ? e.output.midiData : c.data;
  out.send([0x90 | c.ch, note, 127]);
  setTimeout(() => out.send([0x80 | c.ch, note, 0]), 500);
}

function midiPorts() {
  const ins = [...midi.inputs.values()];
  ins.forEach((i) => { i.onmidimessage = onMidi; });
  $('#midiStatus').classList.toggle('ok', ins.length > 0);
  $('#midiStatus span').textContent = ins.length ? ins.map((i) => i.name).join(', ') : 'No MIDI device';
  $('#midiStatus').title = '';
}
async function midiInit() {
  if (!navigator.requestMIDIAccess) {
    $('#midiStatus span').textContent = 'No Web MIDI (use Chrome)';
    $('#midiStatus').title = 'This browser has no Web MIDI. Mapping by clicking still works; use Chrome or Edge for live hardware.';
    return;
  }
  try { midi = await navigator.requestMIDIAccess(); midi.onstatechange = midiPorts; midiPorts(); }
  catch (e) { $('#midiStatus span').textContent = 'MIDI blocked'; $('#midiStatus').title = String(e.message || e); }
}

load();
renderHeader();
